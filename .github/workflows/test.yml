# Runs `npm test` on every push to main and every pull request, on Ubuntu and macOS across the
# active Node lines, then packs the tarball and installs it into a clean consumer project.
# What it proves: the judges, planner and installer behave as the tests assert on a machine that is
# not the author's (the first Ubuntu run found a signal race 60 local passes had missed), and the
# packaged files are enough to run outside the checkout.
# What it does NOT run: any vendor CLI. `cli-run --doctor` reports presence and is allowed to fail.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# one run per branch at a time; a newer push cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: packaged install runs outside the checkout
        run: |
          npm pack --silent
          mkdir -p "${{ runner.temp }}/consumer" && cd "${{ runner.temp }}/consumer"
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/model-orchestrator-*.tgz
          npx model-orchestrator --yes --level 2 --ais claude-code,codex --primary claude-code --no-tools --dir ./out --project ./proj --no-install
          test -f out/bin/lanes.json && test -f proj/.claude/agents/deep-planner.md
          node out/bin/cli-run.mjs --doctor || true
      - run: node bin/cli.js --yes --level 3 --ais claude-code,codex,agy,grok,hermes,qwen,ollama --primary claude-code --apis anthropic,openrouter --dir "${{ runner.temp }}/l3" --project "${{ runner.temp }}/p3" --no-install
      - run: node "${{ runner.temp }}/l3/bin/cli-run.mjs" --doctor || true
      - run: node bin/cli.js --yes --level 1 --ais chatgpt-app --no-tools --dir "${{ runner.temp }}/l1" --project "${{ runner.temp }}/p1" --no-install
