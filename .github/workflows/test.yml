name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: packaged install runs outside the checkout
        run: |
          npm pack --silent
          mkdir -p "${{ runner.temp }}/consumer" && cd "${{ runner.temp }}/consumer"
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/model-orchestrator-*.tgz
          npx model-orchestrator --yes --level 2 --ais claude-code,codex --primary claude-code --no-tools --dir ./out --project ./proj --no-install
          test -f out/bin/lanes.json && test -f proj/.claude/agents/deep-planner.md
          node out/bin/cli-run.mjs --doctor || true
      - run: node bin/cli.js --yes --level 3 --ais claude-code,codex,agy,grok,hermes,qwen,ollama --primary claude-code --apis anthropic,openrouter --dir "${{ runner.temp }}/l3" --project "${{ runner.temp }}/p3" --no-install
      - run: node "${{ runner.temp }}/l3/bin/cli-run.mjs" --doctor || true
      - run: node bin/cli.js --yes --level 1 --ais chatgpt-app --no-tools --dir "${{ runner.temp }}/l1" --project "${{ runner.temp }}/p1" --no-install
