# Publishes the package to npm when a version tag is pushed, with provenance, through npm
# trusted publishing (OIDC): no npm token is stored anywhere. Requires, once, on npmjs.com:
# package settings -> Trusted publisher -> GitHub Actions, owner aunysillyme, repository
# model-orchestrator, workflow release.yml, environment release.
# The publish job runs in the GitHub environment `release`, which deploys from v* tags only.
# Its approval step was removed on 2026-10-05; a pushed tag publishes once the tests pass.
# What it proves: the tag, package.json and the tests agree before anything is published.
# What it does NOT do: create the GitHub release page (RELEASING.md step 5) or bump versions.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: tag and package.json must name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag v$tag but package.json is $pkg"; exit 1; }
      - run: npm test
      - name: Pack and test the release tarball
        run: |
          set -eu
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          tarball="$release/$(npm pack --silent --pack-destination "$release")"
          trial="$(mktemp -d)"
          trap 'rm -rf "$trial"' EXIT
          cd "$trial"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          "$trial/node_modules/.bin/model-orchestrator" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 12.1.0 (reviewed trusted publishing version; needs Node 24.15.0+)
        run: |
          npm install -g npm@12.1.0
          npm --version
      - name: Publish the verified tarball
        run: |
          set -eu
          set -- ./release/*.tgz
          test "$#" -eq 1 && test -f "$1"
          npm publish "$1" --provenance --access public
