# LiteLLM gateway config. One lane per provider you said you have.
# Every key is `os.environ/<NAME>`: the value lives in the environment, never here.
# Bind to ALIASES (model_name), not raw provider ids, so a vendor rename is a one-line repoint.
model_list:
{{GATEWAY_MODELS}}

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
